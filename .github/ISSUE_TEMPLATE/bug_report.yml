name: Bug report
description: Report a reproducible DealHub problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route / API endpoint
  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      options: [Mobile, Tablet, Desktop, API/Not applicable]
  - type: textarea
    id: evidence
    attributes:
      label: Logs, request ID, or screenshots
      description: Remove passwords, tokens, phone numbers, and other personal data.
